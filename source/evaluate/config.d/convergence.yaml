seeds: ${range:42,52}
to_be_seeded:
  - basic
  - numpy
  - torch

default_grid:
  mutual_information: 2.0, 1.0, 0.0
  nonzero_mutual_information: 2.0, 1.0
  dimensionality: 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024
  samples: 100000, 31622, 10000, 3162, 1000, 316, 100

processed:
  mutual_information:
    _target_: builtins.float.__mul__
    _args_:
      - ${raw.mutual_information}
      - ${raw.dimensionality}

n_samples: 
  _target_: builtins.int.__add__
  _args_:
    - ${raw.train_size}
    - ${estimator.estimator.estimate_size}

hydra:
  mode: MULTIRUN
  sweep:
    dir: outputs/highdim/${now:%Y-%m-%d}
    subdir: ${key.estimator}/${key.distribution}/N_1=${raw.train_size}_N_2=${estimator.estimator.estimate_size}/${now:%Y-%m-%d_%H-%M-%S}_${hydra.job.num}
  sweeper:
    max_batch_size: 100 # Makes startup faster, see https://github.com/facebookresearch/hydra/issues/1324.
    params:
      ++raw.train_size: ${default_grid.samples}
      ++estimator.estimator.estimate_size: 100000
      ++distribution.randomize_interactions: false

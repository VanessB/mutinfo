name: highdim/sample_complexity/estimator_dimensionality-n_samples-hidden_dim

sources:
  cFMMI:
    path: "./outputs/highdim/FMMI/sample_complexity/cFMMI"
    aggregate: ["estimator.estimator.backbone_factory.hidden_dim", "estimator.estimator.estimator_factory.marginalizer._target_"]
    pin: {}
    priority: 0
  jFMMI:
    path: "./outputs/highdim/FMMI/sample_complexity/jFMMI"
    aggregate: ["estimator.estimator.backbone_factory.hidden_dim", "estimator.estimator.estimator_factory.marginalizer._target_"]
    pin: {}
    priority: 0

targets:
  - name: "MAE"
    function:
      _target_: __main__.MAE
      _partial_: true
      first: "target"
      second: "estimate.median"

outputs: ["MAE"]

aggregation:
  by: "MAE"
  output: "estimator.estimator.backbone_factory.hidden_dim"

column_to_chart:
  name: "n_samples"

rows_to_chart: ["Source", "Distribution", "raw.dimensionality"]
pin:
  raw.mutual_information: 2.0
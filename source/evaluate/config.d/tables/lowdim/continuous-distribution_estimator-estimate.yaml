name: lowdim/continuous/distribution_estimator-estimate-${pin.n_samples}

sources:
  KSG:
    path: "./outputs/lowdim/2025-10-20/KSG"
    aggregate: ["estimator.k_neighbors"]
    pin: {}
    priority: 0
  WKL:
    path: "./outputs/lowdim/2025-10-20/WKL"
    aggregate: ["estimator.k_neighbors"]
    pin: {}
    priority: 0
  MINE-DV:
    path: "./outputs/lowdim/2025-10-20/MINE-DV"
    aggregate: ["estimator.estimator.backbone_factory.hidden_dim"]
    pin:
      estimator.estimator.estimate_size: 0.5
    priority: 1
  MINE-NWJ:
    path: "./outputs/lowdim/2025-10-20/MINE-NWJ"
    aggregate: ["estimator.estimator.backbone_factory.hidden_dim"]
    pin:
      estimator.estimator.estimate_size: 0.5
    priority: 1
  InfoNCE:
    path: "./outputs/lowdim/2025-10-20/InfoNCE"
    aggregate: ["estimator.estimator.backbone_factory.hidden_dim", "estimator.estimator.estimate_batch_size"]
    pin:
      estimator.estimator.estimate_size: 0.5
    priority: 2

targets:
  - name: "MAE"
    function:
      _target_: __main__.MAE
      _partial_: true
      first: "distribution.mutual_information"
      second: "mutual_information.mean"

outputs: ["MAE", "mutual_information.mean"]

aggregation:
  by: "MAE"
  output: "mutual_information.mean"

column_to_chart:
  name: "distribution.mutual_information"
  apply:
    _target_: builtins.int
    _partial_: true

rows_to_chart: ["Distribution", "Source"]
pin:
  n_samples: 10000
seeds: ${range:42,52}
to_be_seeded:
  - basic
  - numpy
  - torch

default_grid:
  mutual_information: 0.0, 0.5, 1.0, 2.0, 4.0
  nonzero_mutual_information: 0.5, 1.0, 2.0, 4.0
  dimensionality: 1, 2, 4, 8, 16, 32, 64

processed:
  mutual_information:
    _target_: builtins.float.__mul__
    _args_:
      - ${raw.mutual_information}
      - ${raw.dimensionality}

hydra:
  mode: MULTIRUN
  sweep:
    dir: outputs/highdim/${now:%Y-%m-%d}
    subdir: ${key.estimator}/${key.distribution}/N=${n_samples}/${now:%Y-%m-%d_%H-%M-%S}_${hydra.job.num}
  sweeper:
    max_batch_size: 100 # Makes startup faster, see https://github.com/facebookresearch/hydra/issues/1324.
    params:
      ++n_samples: 100, 316, 1000, 3162, 10000 #, 31622, 100000
      ++distribution.randomize_interactions: false
